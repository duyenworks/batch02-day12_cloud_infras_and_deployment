# CI/CD: test → build → deploy Google Cloud Run
# Cần GitHub Secrets: GCP_PROJECT_ID, GCP_SA_KEY

name: Cloud Run CI/CD

on:
  # Disabled — dùng Railway CI/CD thay Cloud Run
  workflow_dispatch:

env:
  WORKING_DIR: 03-cloud-deployment/production-cloud-run
  REGION: asia-southeast1
  REPOSITORY: ai-agent
  SERVICE: ai-agent

jobs:
  # ── CI: lint + test ──
  ci:
    name: CI — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ env.WORKING_DIR }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── CD: deploy to Cloud Run (main branch only) ──
  cd:
    name: CD — Deploy Cloud Run
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build pipeline
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions=_REGION=${{ env.REGION }},_REPOSITORY=${{ env.REPOSITORY }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            .

      - name: Show service URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format 'value(status.url)'
