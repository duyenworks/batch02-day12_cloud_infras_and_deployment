# CI/CD: pytest → deploy Railway
# GitHub Secrets: RAILWAY_TOKEN, RAILWAY_SERVICE_ID
# Railway Dashboard → Root Directory = 02-docker/production

name: Railway CI/CD

on:
  push:
    branches: [main]
    paths:
      - "02-docker/production/**"
      - ".github/workflows/railway-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "02-docker/production/**"
  workflow_dispatch:

env:
  WORKING_DIR: 02-docker/production

jobs:
  ci:
    name: CI — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ env.WORKING_DIR }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short

  cd:
    name: CD — Deploy Railway
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach --service ${{ secrets.RAILWAY_SERVICE_ID }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
