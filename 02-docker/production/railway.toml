# Railway config — deploy từ thư mục 02-docker/production
# Dashboard: Settings → Root Directory = 02-docker/production

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Dùng python main.py — đọc PORT từ env (Railway inject).
# Không dùng "uvicorn ... --port $PORT" vì Railway không expand $PORT qua shell.
startCommand = "python main.py"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
